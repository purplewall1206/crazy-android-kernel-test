buffers { size_kb: 32768 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "mmap_lock/mmap_lock_start_locking"
      ftrace_events: "mmap_lock/mmap_lock_acquire_returned"
      ftrace_events: "mmap_lock/mmap_lock_released"
      buffer_size_kb: 16384
    }
  }
}
duration_ms: 8000
